# **Four more off the daily 2-D product, 2026-09-02, at the owner's ask** --
# and the ice VELOCITY publishes here rather than with the currents, which is
# this repository's D3: it is a vector, but it is one daily frame off the
# dataset the sea surface height already reads, on the same hour as every
# scalar here, where the currents are 6-hourly bracketing pairs. A product
# joins the repository that shares its cadence and its fault domain, not the
# one that shares its file shape.
#
# The concentration publishes unmasked, zeros over open water like ESPC's;
# thickness and velocity are nulled under 15% concentration -- this model writes
# 0 m and 0 m/s over open water rather than missing -- so the thickness reads
# like ESPC's and the drift does not draw a still ocean.
[products.sic-mercator]
title = "Mercator Ocean sea ice concentration"
step = "mercator"
roots = ["sic-mercator.json"]
writes = ["sic-mercator*.json"]
max_age_hours = 30
