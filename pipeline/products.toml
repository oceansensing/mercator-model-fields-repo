# What this repository publishes: the Mercator Ocean SCALAR FIELDS -- SST, SSS,
# SSH, temperature at 29 m and ocean heat content, and nothing else.
#
# **A PEER to ESPC, not a fallback** (`DECISIONS.md` D1). Both models are
# fetched every run and the reader chooses; nothing switches over, and the
# contract's `source` and `modelRun` are what tell a reader which ocean is on
# screen.
#
# **Why its own repository** (D2): the axis that costs bytes is vectors
# against scalars. ESPC's currents are 738.7 MB of tiles against 169.5 MB for
# its five scalar fields, so the two halves have different budgets and
# different failure modes, and sharing a publish gate would let one hold back
# the other.
#
# Two rules inherited from the ESPC siblings, both learned the hard way there:
#
# - **Every `roots` entry here must be one the site's `test-schema.mjs
#   --roots` publishes.** The orchestrator exits 2 on a root the contract does
#   not know, and stops the publish.
# - **A product that leaves takes its files with it.** The stage is seeded
#   from the last publish, so a root a pipeline stops writing is carried
#   forward for ever.
#
# **The credentials are this repository's, not the site's.** The fetcher runs
# here, so `COPERNICUSMARINE_SERVICE_USERNAME` and `_PASSWORD` are secrets on
# this repository. There is no API key. And because this repository is PUBLIC
# while the site is not, everything the fetcher prints goes through its
# `mask()` -- the toolbox announces which account it logged in as.

# **The paths are relative to the site checkout, not to this workspace.** The
# orchestrator runs these with the site checkout as their working directory.
[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

[defaults]
timeout_minutes = 30

# **Its own lane, named for the SERVER.** A lane is a lock: two steps sharing
# one never run together. Copernicus is not HYCOM, so this contends with
# nothing here -- and naming the lane after the service keeps that true when a
# second Copernicus product lands beside it.
[steps.mercator]
cmd = ["python3", "scripts/fetch-mercator.py", "--only=sst-mercator,sss-mercator,ssh-mercator,temp29-mercator,ohc-mercator,sic-mercator,sit-mercator,icevel-mercator,bottomt-mercator,bottoms-mercator,bottomdepth-mercator,mld-mercator,pbo-mercator,ssta-mercator"]
lane = "copernicus"

# **The daily-mean levels, a step of their own on the same lane** (2026-10-10):
# temperature, salinity and vertical velocity at 36 levels, 108 level reads and
# 108 roots with their tiles, measured 2026-10-10 on a 16-core Mac at about
# 103 s a quantity; the backstop is several times a 4-core runner's expected.
[steps.mercator-levels]
cmd = ["python3", "scripts/fetch-mercator.py", "--only=temp-mercator,sal-mercator,w-mercator"]
lane = "copernicus"
timeout_minutes = 60

# **Hours, and they are the upstream's rather than ours.** `max_age_hours`
# measures the reader's distance from the newest published valid time.
# Mercator's currents are 6-hourly and its scalars daily, so the two halves
# are allowed different distances -- copying one number across both would
# make the daily fields look permanently late or the 6-hourly currents look
# permanently fresh.

[products.sst-mercator]
title = "Mercator Ocean sea surface temperature"
step = "mercator"
roots = ["sst-mercator.json"]
writes = ["sst-mercator*.json"]
max_age_hours = 30
namespace = ["python3", "scripts/fetch-mercator.py", "--namespace", "--only=sst-mercator"]

# **Native resolution, 20 degree boxes, one tier per depth AND per lead.** A
# forecast frame pointing at lead 0's tiles would draw the present at 1/12 deg
# and call it the forecast -- sharp, plausible and wrong -- so the contract
# refuses a lead file whose `tileIndex` is not its own set, and the fetcher
# names the directories accordingly.
#
# **The tiles cost nothing extra upstream.** The fetch already pulls the full
# native global frame in order to decimate it for the overview; a tile is a
# slice of that same array. What they cost is published bytes and the time to
# serialise them, not another read off the service.
[products.sst-mercator.tiles]
build = ["python3", "scripts/fetch-mercator.py", "--tiles", "--only=sst-mercator"]
key = ["python3", "scripts/fetch-mercator.py", "--tile-key", "--only=sst-mercator"]
# **Its own cache, not one shared across the five.** The key is computed per
# product, so products writing one cache name would each save over the
# others and every restore would be somebody else's tier.
cache = "mercator-sst-tiles"
match = [
  ["tiles-sst-mercator", "sst-mercator.json"],
]

[products.temp29-mercator]
# **29 m, not 30 -- the model's level 14 is 29.445 m** (the owner's z14,
# 2026-09-01), and the root is named for the depth that is actually there,
# as `cur-mercator-47m` is. The same quantity as ESPC's `temp30-navy`, off
# the daily temperature product.
title = "Mercator Ocean temperature at 29 m"
step = "mercator"
roots = ["temp29-mercator.json"]
writes = ["temp29-mercator*.json"]
max_age_hours = 30
namespace = ["python3", "scripts/fetch-mercator.py", "--namespace", "--only=temp29-mercator"]

[products.temp29-mercator.tiles]
build = ["python3", "scripts/fetch-mercator.py", "--tiles", "--only=temp29-mercator"]
key = ["python3", "scripts/fetch-mercator.py", "--tile-key", "--only=temp29-mercator"]
cache = "mercator-temp29-tiles"
match = [
  ["tiles-temp29-mercator", "temp29-mercator.json"],
]

[products.ohc-mercator]
# **Tropical cyclone heat potential, the same quantity as ESPC's `ohc-navy`
# and the same constants**: rho * cp * the integral of (T - 26 C) from the
# 26 C isotherm to the surface, in kJ/cm2, off the daily temperature
# profile -- every level to 300 m plus one, about 29 reads. Where the surface
# is at or below 26 C the cell is absent, not zero; where the column is
# still warm at the bottom of the read the cell is absent and counted in
# the run log. The site's fetcher holds its integral against ESPC's function
# as the oracle.
title = "Mercator Ocean heat content"
step = "mercator"
roots = ["ohc-mercator.json"]
writes = ["ohc-mercator*.json"]
max_age_hours = 30
namespace = ["python3", "scripts/fetch-mercator.py", "--namespace", "--only=ohc-mercator"]

[products.ohc-mercator.tiles]
build = ["python3", "scripts/fetch-mercator.py", "--tiles", "--only=ohc-mercator"]
key = ["python3", "scripts/fetch-mercator.py", "--tile-key", "--only=ohc-mercator"]
cache = "mercator-ohc-tiles"
match = [
  ["tiles-ohc-mercator", "ohc-mercator.json"],
]

